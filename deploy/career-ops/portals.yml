# Expanded Career Intelligence discovery configuration.
# Source: career-ops-hq/career-ops templates/portals.example.yml.
# Broad title coverage; no arbitrary result cap, location restriction or blacklist.
# Search-engine-only sources need an external adapter; those are not enabled.
# Employer URLs may change. Read the scan audit before trusting source coverage.

scan_history:
  recheck_after_days: 14

title_filter:
  positive:
    - "Data Scientist"
    - "Data Science"
    - "Applied Scientist"
    - "Applied AI"
    - "Marketing Science"
    - "Marketing Scientist"
    - "Marketing Analytics"
    - "Marketing Measurement"
    - "Marketing Mix"
    - "Marketing Effectiveness"
    - "Decision Scientist"
    - "Decision Science"
    - "Machine Learning"
    - "ML Engineer"
    - "AI Engineer"
    - "AI Research"
    - "LLM Engineer"
    - "Forecasting"
    - "Econometric"
    - "Causal Inference"
    - "Experimentation"
    - "Optimization"
    - "Marketing Attribution"
    - "Marketing Intelligence"
    - "Product Analytics"
    - "Growth Analytics"
    - "Growth Scientist"
    - "Measurement Scientist"
    - "Analytics Scientist"
    - "Quantitative Scientist"
    - "Data Analytics"
    - "Principal Analyst"
    - "Analytics Lead"
    - "Director + Analytics"
    - "Head + Data Science"
    - "Revenue Science"
    - "Data Science Manager"
    - "AI Solutions Engineer"
    - "AI Research Scientist"
    - "Data Science Engineer"
    - "ML Scientist"
    - "Marketing Analyst"
    - "Customer Analytics"
  negative: []

search_queries: []
job_boards: []

