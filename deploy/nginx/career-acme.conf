# Temporary HTTP-only challenge site. Activate before certbot webroot issuance.
# Serves no Career Intelligence application traffic.
server {
    listen 80;
    listen [::]:80;
    server_name career.cadacrew.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
