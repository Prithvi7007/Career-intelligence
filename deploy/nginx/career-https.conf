# Career Intelligence: independent authenticated HTTPS reverse proxy.
# Backend stays on 127.0.0.1:3417, not publicly accessible.
server {
    listen 80;
    listen [::]:80;
    server_name career.cadacrew.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://career.cadacrew.fun$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name career.cadacrew.fun;

    ssl_certificate /etc/letsencrypt/live/career.cadacrew.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/career.cadacrew.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CareerSSL:2m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    auth_basic "Career Intelligence — private access";
    auth_basic_user_file /etc/nginx/.career-intelligence.htpasswd;

    location / {
        limit_except GET HEAD POST PATCH {
            deny all;
        }

        proxy_pass http://127.0.0.1:3417;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3417;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The localhost-only backend currently accepts localhost Origins only.
        # For mutation requests, its X-Requested-With requirement still applies.
        # Browser cross-origin requests with that header are preflighted and
        # are not authorized by this Nginx server.
        proxy_set_header Origin "http://127.0.0.1:3417";
        proxy_hide_header Server;
        proxy_redirect off;
        proxy_buffering on;
        proxy_read_timeout 45s;
        client_max_body_size 64k;
    }
}
